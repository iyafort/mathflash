name: Build macOS App

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build-macos:
    runs-on: macos-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.7.0"   # Your Flutter version

      - name: Enable macOS platform
        run: flutter config --enable-macos-desktop

      - name: Create platform files if missing
        run: flutter create .

      - name: Install dependencies
        run: flutter pub get

      - name: Build macOS Release
        run: flutter build macos --release

      - name: Archive macOS app
        run: |
          cd build/macos/Build/Products/Release/
          zip -r MathFlash-macOS.zip MathFlash.app

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: MathFlash-macOS
          path: build/macos/Build/Products/Release/MathFlash-macOS.zip
